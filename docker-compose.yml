services:
  # Your Rust chat application
  live_chat:
    build: .
    image: live_chat:latest
    container_name: live_chat_app
    restart: unless-stopped
    # Binds internally to the host to prevent public bypass
    ports:
      - "127.0.0.1:3030:3030"

  # The Nginx reverse proxy
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80" # Exposes HTTP port 80 to the public
    depends_on:
      - live_chat